[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syk-simulasyon-veri-modeli"
version = "1.7.0"
description = "SyKaşif SPR-002 DSP-0003 Frekans Çözümleme"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn>=0.51,<1",
    "websockets>=17,<18",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "playwright>=1.61,<2",
    "pytest-playwright>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
